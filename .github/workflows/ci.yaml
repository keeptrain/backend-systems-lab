name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production binary (linux x64)
        run: bun run build:linux-x64

      - name: Verify binary target
        run: file server-linux-x64 | grep -q "ELF 64-bit"

      - name: Smoke test
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ./server-linux-x64 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/; then
              exit 0
            fi
            sleep 0.5
          done

          echo "Server did not respond on port 3000" >&2
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: server-linux-x64
          path: app/server-linux-x64
          if-no-files-found: error
